<!--
  P3-5 — sticky bottom CTA on long pages.
  Injected on /receptionist/* + /docs/ + /websites/ + /local-seo/ where the
  user can scroll past every primary CTA. The bar sticks at viewport bottom
  and surfaces FOUR actions in research-backed dual-CTA order:
    1. AI quiz (low-commitment, ~41% opt-in vs 18% baseline — primary CTA)
    2. WhatsApp (high-commitment, fastest async path)
    3. Ring (high-commitment, synchronous)
    4. Email (high-commitment, slowest async path)

  The quiz button carries data-cmt-cta="quiz" — cohesion-chatbot.html
  binds the same discovery modal to any element with that selector OR
  the legacy .cmt-chat-fab class, so the standalone floating fab can be
  suppressed on banner pages without losing the funnel.

  Tokens substituted by scripts/inject-cohesion.py:
    {{phone}}    — primary tel:+ link, e.g. +35361788120
    {{wa_text}}  — pre-filled WhatsApp message, URL-encoded
    {{email}}    — mailto: address (always hello@callmeie.ie)
    {{label}}    — short sector label for the bar — e.g. "Solicitor practices"

  When this partial is present on a page, scripts/inject-cohesion.py
  also adds the `.has-bottom-cta` class to the body element so cohesion.css
  hides BOTH the .cmt-wa-fab (was: lifted to bottom:92px) and the
  .cmt-chat-fab on banner pages — the banner now carries every CTA.
-->
<aside class="cmt-bottom-cta" role="complementary" aria-label="Quick contact and AI fit-check">
  <span class="cmt-bottom-cta__label">{{label}}</span>

  <button type="button"
          class="cmt-bottom-cta__quiz"
          data-cmt-cta="quiz"
          aria-label="Open CallMeIE fit-check quiz (30 seconds)">
    <span class="cmt-bottom-cta__quiz-glyph" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </span>
    <span class="cmt-bottom-cta__quiz-text">
      <span class="cmt-bottom-cta__quiz-full">Find your fit · 30s</span>
      <span class="cmt-bottom-cta__quiz-short">Find your fit</span>
    </span>
    <span class="cmt-bottom-cta__quiz-arrow" aria-hidden="true">→</span>
  </button>

  <span class="cmt-bottom-cta__comms" role="group" aria-label="Talk to us directly">
    <a class="cmt-bottom-cta__icon cmt-bottom-cta__icon--whatsapp"
       href="https://wa.me/353857863564?text={{wa_text}}"
       target="_blank" rel="noopener"
       data-cmt-cta="whatsapp"
       aria-label="WhatsApp 085 786 3564">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
        <path d="M20.52 3.449C18.24 1.245 15.24 0 12.045 0 5.463 0 .104 5.334.101 11.892c0 2.096.549 4.142 1.595 5.945L0 24l6.335-1.652c1.746.943 3.71 1.444 5.71 1.447h.006c6.585 0 11.946-5.336 11.949-11.896 0-3.176-1.24-6.165-3.495-8.411z"/>
      </svg>
      <span class="cmt-bottom-cta__icon-label">WhatsApp</span>
    </a>
    <a class="cmt-bottom-cta__icon cmt-bottom-cta__icon--ring"
       href="tel:{{phone}}"
       data-cmt-cta="ring"
       aria-label="Ring 061 788 120">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/>
      </svg>
      <span class="cmt-bottom-cta__icon-label">Ring</span>
    </a>
    <a class="cmt-bottom-cta__icon cmt-bottom-cta__icon--email"
       href="mailto:{{email}}"
       data-cmt-cta="email"
       aria-label="Email hello@callmeie.ie">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22,6 12,13 2,6"/>
      </svg>
      <span class="cmt-bottom-cta__icon-label">Email</span>
    </a>
  </span>
</aside>

<style>
  .cmt-bottom-cta {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 90;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px env(safe-area-inset-bottom, 10px);
    background: rgba(15, 23, 42, 0.96);
    color: #f8fafc;
    box-shadow: 0 -8px 24px rgba(0,0,0,.18);
    font-family: var(--cmt-font-body, 'Inter', system-ui, sans-serif);
    font-size: 13px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  /* ============ Sector label ============ */
  .cmt-bottom-cta__label {
    color: #cbd5e1;
    font-weight: 500;
    letter-spacing: 0.01em;
    flex: 0 0 auto;
    white-space: nowrap;
  }

  /* ============ Primary quiz CTA ============ */
  .cmt-bottom-cta__quiz {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0;
    padding: 9px 16px;
    border: 0;
    border-radius: 999px;
    background: var(--cmt-brand, #1d3557);
    color: #ffffff;
    font: 600 13px/1.1 inherit;
    letter-spacing: 0.01em;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(29, 53, 87, .35), inset 0 1px 0 rgba(255,255,255,.08);
    transition: filter var(--cmt-duration-fast, .15s) var(--cmt-ease, cubic-bezier(.22,1,.36,1)),
                transform var(--cmt-duration-fast, .15s) var(--cmt-ease, cubic-bezier(.22,1,.36,1));
    flex: 1 1 auto;
    justify-content: center;
    min-height: 40px;
  }
  .cmt-bottom-cta__quiz:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .cmt-bottom-cta__quiz:focus-visible {
    outline: 2px solid #f8fafc;
    outline-offset: 2px;
  }
  .cmt-bottom-cta__quiz-glyph { display: inline-flex; opacity: .9; }
  .cmt-bottom-cta__quiz-arrow {
    font-family: var(--cmt-font-mono, ui-monospace, monospace);
    font-size: 14px;
    opacity: .85;
    margin-left: 2px;
  }
  .cmt-bottom-cta__quiz-full { display: inline; }
  .cmt-bottom-cta__quiz-short { display: none; }

  /* ============ Comms group ============ */
  .cmt-bottom-cta__comms {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .cmt-bottom-cta__icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 999px;
    text-decoration: none;
    transition: filter var(--cmt-duration-fast, .15s) var(--cmt-ease, cubic-bezier(.22,1,.36,1)),
                transform var(--cmt-duration-fast, .15s) var(--cmt-ease, cubic-bezier(.22,1,.36,1)),
                border-color var(--cmt-duration-fast, .15s) var(--cmt-ease, cubic-bezier(.22,1,.36,1));
  }
  .cmt-bottom-cta__icon:hover { transform: translateY(-1px); }
  .cmt-bottom-cta__icon:focus-visible {
    outline: 2px solid #f8fafc;
    outline-offset: 2px;
  }
  .cmt-bottom-cta__icon-label {
    display: none;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding-right: 4px;
  }

  .cmt-bottom-cta__icon--whatsapp {
    background: #25D366;
    color: #073b1f;
  }
  .cmt-bottom-cta__icon--whatsapp:hover { filter: brightness(1.06); }
  .cmt-bottom-cta__icon--ring,
  .cmt-bottom-cta__icon--email {
    background: transparent;
    color: #cbd5e1;
    border: 1px solid rgba(255,255,255,.18);
  }
  .cmt-bottom-cta__icon--ring:hover,
  .cmt-bottom-cta__icon--email:hover {
    color: #f8fafc;
    border-color: rgba(255,255,255,.36);
  }

  /* ============ Responsive ============ */
  /* Mobile: hide sector label, keep icon-only comms */
  @media (max-width: 600px) {
    .cmt-bottom-cta__label { display: none; }
    .cmt-bottom-cta { gap: 8px; padding: 8px 10px env(safe-area-inset-bottom, 8px); }
    .cmt-bottom-cta__comms { gap: 6px; }
  }
  @media (max-width: 380px) {
    /* Tightest phones: shorten quiz label so it fits beside 3 comms circles */
    .cmt-bottom-cta__quiz-full { display: none; }
    .cmt-bottom-cta__quiz-short { display: inline; }
    .cmt-bottom-cta__quiz { padding: 9px 12px; }
  }

  /* Tablet: reveal icon-labels so comms aren't anonymous icons */
  @media (min-width: 600px) {
    .cmt-bottom-cta__icon {
      width: auto;
      padding: 9px 14px;
    }
    .cmt-bottom-cta__icon-label { display: inline; }
  }

  /* Desktop: stop quiz button sprawling across viewport */
  @media (min-width: 768px) {
    .cmt-bottom-cta__quiz { flex: 0 0 auto; }
  }

  @media print {
    .cmt-bottom-cta { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cmt-bottom-cta__quiz,
    .cmt-bottom-cta__quiz:hover,
    .cmt-bottom-cta__icon,
    .cmt-bottom-cta__icon:hover { transition: none; transform: none; }
  }
</style>

<script>
  // Body class so cohesion.css hides the standalone .cmt-wa-fab AND
  // .cmt-chat-fab on banner pages — the banner above now carries every CTA.
  (function () {
    if (document.body) {
      document.body.classList.add('has-bottom-cta');
    } else {
      document.addEventListener('DOMContentLoaded', function () {
        document.body.classList.add('has-bottom-cta');
      }, { once: true });
    }
  })();
</script>
