<!--
  P3-5 — sticky bottom CTA on long pages.
  Injected on /receptionist/* + /docs/ + /websites/ where the user can
  scroll past every primary CTA. The bar sticks at viewport bottom and
  surfaces the three actions Adam can field today: ring the Limerick line
  +353 61 788 120 (live since 2026-05-11), WhatsApp, email.
  Tokens substituted by scripts/inject-cohesion.py:
    {{phone}}    — primary tel:+ link, e.g. +35361788120
    {{wa_text}}  — pre-filled WhatsApp message, URL-encoded
    {{email}}    — mailto: address (always hello@callmeie.ie)
    {{label}}    — short label for the bar — e.g. "Receptionist demo"
  When this partial is present on a page, scripts/inject-cohesion.py
  also adds the `.has-bottom-cta` class to the body element so the
  WhatsApp FAB at bottom-right lifts above the bar (cohesion.css L517).
-->
<aside class="cmt-bottom-cta" role="complementary" aria-label="Quick contact">
  <span class="cmt-bottom-cta__label">{{label}}</span>
  <a class="cmt-bottom-cta__btn cmt-bottom-cta__btn--primary"
     href="https://wa.me/353857863564?text={{wa_text}}"
     target="_blank" rel="noopener"
     data-cmt-cta="whatsapp">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <path d="M20.52 3.449C18.24 1.245 15.24 0 12.045 0 5.463 0 .104 5.334.101 11.892c0 2.096.549 4.142 1.595 5.945L0 24l6.335-1.652c1.746.943 3.71 1.444 5.71 1.447h.006c6.585 0 11.946-5.336 11.949-11.896 0-3.176-1.24-6.165-3.495-8.411z"/>
    </svg>
    <span class="cmt-bottom-cta__text"><span class="cmt-bottom-cta__text-full">WhatsApp · 085 786 3564</span><span class="cmt-bottom-cta__text-short">WhatsApp</span></span>
  </a>
  <a class="cmt-bottom-cta__btn cmt-bottom-cta__btn--ghost"
     href="tel:{{phone}}"
     data-cmt-cta="ring"
    >
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/>
    </svg>
    <span class="cmt-bottom-cta__text"><span class="cmt-bottom-cta__text-full">Ring 061 788 120</span><span class="cmt-bottom-cta__text-short">Ring</span></span>
  </a>
  <a class="cmt-bottom-cta__btn cmt-bottom-cta__btn--ghost"
     href="mailto:{{email}}"
     data-cmt-cta="email">
    <span>Email</span>
  </a>
</aside>

<style>
  .cmt-bottom-cta {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px env(safe-area-inset-bottom, 10px);
    background: rgba(15, 23, 42, 0.96);
    color: #f8fafc;
    box-shadow: 0 -8px 24px rgba(0,0,0,.18);
    font-family: var(--cmt-font-body, 'Inter', system-ui, sans-serif);
    font-size: 13px;
    backdrop-filter: blur(6px);
  }
  .cmt-bottom-cta__label {
    color: #cbd5e1;
    margin-right: auto;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  @media (max-width: 600px) {
    .cmt-bottom-cta__label { display: none; }
    .cmt-bottom-cta { gap: 6px; padding: 8px 8px env(safe-area-inset-bottom, 8px); }
    .cmt-bottom-cta__btn { padding: 8px 10px; font-size: 12px; }
  }
  .cmt-bottom-cta__text-full { display: inline; }
  .cmt-bottom-cta__text-short { display: none; }
  @media (max-width: 540px) {
    .cmt-bottom-cta__text-full { display: none; }
    .cmt-bottom-cta__text-short { display: inline; }
  }
  .cmt-bottom-cta__btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    transition: filter 0.15s ease, transform 0.15s ease;
    white-space: nowrap;
  }
  .cmt-bottom-cta__btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .cmt-bottom-cta__btn--primary { background: var(--cmt-brand, #1d3557); }
  .cmt-bottom-cta__btn--whatsapp { background: #25D366; color: #073b1f; }
  .cmt-bottom-cta__btn--ghost {
    background: transparent;
    color: #cbd5e1;
    border: 1px solid rgba(255,255,255,.18);
  }
  .cmt-bottom-cta__btn--ghost:hover { color: #f8fafc; border-color: rgba(255,255,255,.36); }
  @media print {
    .cmt-bottom-cta { display: none !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cmt-bottom-cta__btn,
    .cmt-bottom-cta__btn:hover { transition: none; transform: none; }
  }
</style>

<script>
  // Body class so the WhatsApp FAB at bottom-right lifts above this bar.
  // Cohesion CSS at _partials/cohesion.css L517 already targets
  // body.has-bottom-cta .cmt-wa-fab — this script wires the trigger.
  (function () {
    if (document.body) {
      document.body.classList.add('has-bottom-cta');
    } else {
      document.addEventListener('DOMContentLoaded', function () {
        document.body.classList.add('has-bottom-cta');
      }, { once: true });
    }
  })();
</script>
