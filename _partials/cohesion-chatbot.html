<!--
  Discovery chatbot widget (P3) — vanilla JS, no build step.
  Tokens substituted by scripts/inject-cohesion.py:
    {{page_context}} — one of: hub | receptionist | docs | websites
  Sits bottom-LEFT to avoid the WhatsApp FAB at bottom-right.
  All conversation state lives in sessionStorage; no PII reaches the
  server until the visitor answers all four questions and the widget
  POSTs the payload to /api/discovery.
-->
<button type="button" class="cmt-chat-fab"
        aria-label="Open CallMeIE discovery chatbot"
        data-cmt-chat-context="{{page_context}}">
  <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <span class="cmt-chat-label">Find your fit · 30 sec</span>
</button>

<div class="cmt-chat-shell" role="dialog" aria-modal="true"
     aria-labelledby="cmt-chat-title" hidden>
  <div class="cmt-chat-card">
    <header class="cmt-chat-head">
      <span class="cmt-chat-eyebrow">CallMeIE · Limerick</span>
      <h2 id="cmt-chat-title">Quick fit-check</h2>
      <button type="button" class="cmt-chat-close" aria-label="Close">×</button>
    </header>

    <div class="cmt-chat-body" data-cmt-chat-body>
      <!-- Filled in client-side as the visitor advances. -->
    </div>

    <footer class="cmt-chat-foot">
      <span class="cmt-chat-progress" data-cmt-chat-progress>1 / 4</span>
      <span class="cmt-chat-disclosure">AI quiz · Adam reviews every booking · alerts via private Telegram bot (owner-only) — see <a href="/legal/privacy.html#sec-5" style="color:inherit;text-decoration:underline">privacy</a></span>
    </footer>
  </div>
</div>

<style>
  .cmt-chat-fab {
    position: fixed;
    left: 20px; bottom: 20px;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 18px 12px 14px;
    border: 0; border-radius: 999px;
    background: var(--cmt-brand, #1d3557);
    color: #ffffff;
    font-family: var(--cmt-font-body, 'Inter', system-ui, sans-serif);
    font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    box-shadow: 0 8px 24px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.12);
    z-index: 95;
    cursor: pointer;
    transition: transform .15s cubic-bezier(.22,1,.36,1),
                box-shadow .15s cubic-bezier(.22,1,.36,1);
  }
  .cmt-chat-fab:hover, .cmt-chat-fab:focus-visible {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 12px 28px rgba(0,0,0,.22), 0 4px 8px rgba(0,0,0,.14);
  }
  .cmt-chat-fab:focus-visible {
    outline: 3px solid var(--cmt-accent, #c96f32);
    outline-offset: 4px;
  }
  .cmt-chat-fab svg { display: block; }
  @media (max-width: 480px) {
    .cmt-chat-fab {
      left: 16px; bottom: 16px;
      padding: 10px 14px 10px 12px;
      font-size: 12px;
    }
    .cmt-chat-label { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cmt-chat-fab, .cmt-chat-fab:hover { transition: none; transform: none; }
  }
  @media print {
    .cmt-chat-fab, .cmt-chat-shell { display: none !important; }
  }

  .cmt-chat-shell {
    position: fixed; inset: 0;
    z-index: 200;
    background: rgba(15, 23, 42, 0.42);
    display: flex; align-items: flex-end; justify-content: flex-start;
    padding: 24px;
    backdrop-filter: blur(2px);
  }
  .cmt-chat-shell[hidden] { display: none !important; }
  .cmt-chat-card {
    width: min(440px, 100%);
    max-height: min(640px, calc(100vh - 48px));
    display: flex; flex-direction: column;
    background: var(--cmt-paper, #f8f5f0);
    color: var(--cmt-ink, #1c1f24);
    border-radius: 12px;
    box-shadow: 0 24px 64px rgba(0,0,0,.32), 0 6px 16px rgba(0,0,0,.16);
    overflow: hidden;
    font-family: var(--cmt-font-body, 'Inter', system-ui, sans-serif);
  }
  @media (max-width: 480px) {
    .cmt-chat-shell { padding: 0; align-items: stretch; justify-content: stretch; }
    .cmt-chat-card { width: 100%; max-height: 100vh; border-radius: 0; }
  }

  .cmt-chat-head {
    position: relative;
    padding: 18px 56px 14px 22px;
    border-bottom: 1px solid var(--cmt-line, #d8cfc1);
    background: var(--cmt-paper-alt, #efe9de);
  }
  .cmt-chat-eyebrow {
    display: block;
    font-family: var(--cmt-font-mono, 'JetBrains Mono', ui-monospace, monospace);
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--cmt-brand, #1d3557);
  }
  #cmt-chat-title {
    margin: 4px 0 0;
    font-family: var(--cmt-font-display, 'Fraunces', Georgia, serif);
    font-style: italic; font-weight: 700;
    font-size: 22px; line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .cmt-chat-close {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px;
    border: 0; border-radius: 50%;
    background: rgba(0,0,0,.06);
    font-size: 22px; line-height: 1;
    color: inherit; cursor: pointer;
    display: grid; place-items: center;
  }
  .cmt-chat-close:hover { background: rgba(0,0,0,.12); }
  .cmt-chat-close:focus-visible {
    outline: 2px solid var(--cmt-brand, #1d3557); outline-offset: 2px;
  }

  .cmt-chat-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 22px 22px 8px;
  }
  .cmt-chat-prompt {
    margin: 0 0 14px;
    font-size: 16px; line-height: 1.45;
    color: var(--cmt-ink, #1c1f24);
  }
  .cmt-chat-prompt strong { font-weight: 700; }
  .cmt-chat-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin: 0 0 14px;
  }
  .cmt-chat-chip {
    border: 1px solid var(--cmt-line, #d8cfc1);
    background: #fff;
    color: var(--cmt-ink, #1c1f24);
    border-radius: 999px;
    padding: 9px 14px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background .12s ease, border-color .12s ease;
  }
  .cmt-chat-chip:hover { background: var(--cmt-paper-alt, #efe9de); }
  .cmt-chat-chip[aria-pressed="true"] {
    background: var(--cmt-brand, #1d3557); color: #fff;
    border-color: var(--cmt-brand, #1d3557);
  }
  .cmt-chat-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--cmt-line, #d8cfc1);
    border-radius: 6px;
    background: #fff;
    font: inherit;
    color: inherit;
    margin: 0 0 12px;
  }
  .cmt-chat-input:focus-visible {
    outline: 2px solid var(--cmt-brand, #1d3557); outline-offset: 1px;
  }
  .cmt-chat-skip-row {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 4px;
  }
  .cmt-chat-btn {
    border: 0; cursor: pointer;
    padding: 10px 16px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.02em;
  }
  .cmt-chat-btn-primary {
    background: var(--cmt-brand, #1d3557);
    color: #fff;
    box-shadow: 0 2px 0 rgba(0,0,0,.12);
  }
  .cmt-chat-btn-primary:hover {
    background: var(--cmt-brand-hover, #14253f);
  }
  .cmt-chat-btn-ghost {
    background: transparent;
    color: var(--cmt-muted, #6b665d);
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 8px 4px;
  }
  .cmt-chat-btn-ghost:hover { color: var(--cmt-ink, #1c1f24); }

  .cmt-chat-result {
    background: #fff;
    border: 1px solid var(--cmt-line, #d8cfc1);
    border-left: 4px solid var(--cmt-brand, #1d3557);
    border-radius: 6px;
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .cmt-chat-result-tag {
    font-family: var(--cmt-font-mono, 'JetBrains Mono', ui-monospace, monospace);
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--cmt-brand, #1d3557);
    display: block; margin-bottom: 6px;
  }
  .cmt-chat-result-anchor {
    display: inline-block;
    margin-bottom: 8px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--cmt-paper-alt, #efe9de);
    font-size: 12px; font-weight: 600;
    color: var(--cmt-ink, #1c1f24);
  }
  .cmt-chat-result-text {
    margin: 4px 0 0;
    font-size: 14px; line-height: 1.5;
    color: var(--cmt-ink, #1c1f24);
  }
  .cmt-chat-cta-list {
    display: flex; flex-direction: column; gap: 8px;
    margin: 14px 0 8px;
  }
  .cmt-chat-cta {
    display: block;
    padding: 12px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 14px; font-weight: 600;
    text-align: center;
  }
  .cmt-chat-cta[data-kind="primary"] {
    background: #25D366; color: #fff;
  }
  .cmt-chat-cta[data-kind="primary"]:hover { filter: brightness(0.96); }
  .cmt-chat-cta[data-kind="secondary"] {
    background: var(--cmt-brand, #1d3557); color: #fff;
  }
  .cmt-chat-cta[data-kind="secondary"]:hover {
    background: var(--cmt-brand-hover, #14253f);
  }
  .cmt-chat-cta[data-kind="tertiary"] {
    background: transparent; color: var(--cmt-brand, #1d3557);
    border: 1px solid var(--cmt-line, #d8cfc1);
  }
  .cmt-chat-cta[data-kind="tertiary"]:hover {
    background: var(--cmt-paper-alt, #efe9de);
  }

  .cmt-chat-loading {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0;
    font-size: 14px;
    color: var(--cmt-muted, #6b665d);
  }
  .cmt-chat-loading::before {
    content: ""; width: 14px; height: 14px;
    border: 2px solid var(--cmt-line, #d8cfc1);
    border-top-color: var(--cmt-brand, #1d3557);
    border-radius: 50%;
    animation: cmt-chat-spin 0.8s linear infinite;
  }
  @keyframes cmt-chat-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .cmt-chat-loading::before { animation: none; border-top-color: transparent; }
  }

  .cmt-chat-error {
    background: #fff5f0;
    border: 1px solid #d97757;
    color: #8b3a18;
    border-radius: 6px;
    padding: 10px 12px;
    margin: 0 0 12px;
    font-size: 13px;
  }

  .cmt-chat-foot {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px;
    padding: 12px 22px 16px;
    border-top: 1px solid var(--cmt-line, #d8cfc1);
    background: var(--cmt-paper-alt, #efe9de);
  }
  .cmt-chat-progress {
    font-family: var(--cmt-font-mono, 'JetBrains Mono', ui-monospace, monospace);
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--cmt-brand, #1d3557);
  }
  .cmt-chat-disclosure {
    font-size: 11px; line-height: 1.4;
    color: var(--cmt-muted, #6b665d);
    text-align: right;
    flex: 1; min-width: 0;
  }
</style>

<script>
(function () {
  // Skip if widget already wired (e.g. multiple sentinels per page).
  if (window.__cmtChatBound) return;
  window.__cmtChatBound = true;

  // The chatbot sentinel typically renders ABOVE the bottom-cta sentinel in the
  // document, so [data-cmt-cta="quiz"] may not exist yet when this script first
  // parses. Defer the trigger query + binding until DOMContentLoaded.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init, { once: true });
  } else {
    init();
  }

  function init() {
  // Two trigger types:
  //   .cmt-chat-fab           — standalone floating fab (hub pages)
  //   [data-cmt-cta="quiz"]   — in-banner quiz btn (banner-bearing pages, where
  //                             the standalone fab is hidden via cohesion.css)
  // Both open the same discovery modal so the funnel never loses a trigger.
  var triggers = Array.prototype.slice.call(
    document.querySelectorAll('.cmt-chat-fab, [data-cmt-cta="quiz"]')
  );
  var shell = document.querySelector('.cmt-chat-shell');
  if (!triggers.length || !shell) return;

  var body = shell.querySelector('[data-cmt-chat-body]');
  var progress = shell.querySelector('[data-cmt-chat-progress]');
  var closeBtn = shell.querySelector('.cmt-chat-close');
  // Page context lives on the .cmt-chat-fab data-attribute set per page
  // (e.g. "receptionist", "docs", "websites", "local-seo"). The banner quiz btn
  // carries no data-cmt-chat-context, so prefer the fab; fall back to 'hub'.
  var contextSource = triggers.filter(function (t) {
    return t.classList && t.classList.contains('cmt-chat-fab');
  })[0] || triggers[0];
  var pageContext = (contextSource.getAttribute('data-cmt-chat-context') || 'hub').slice(0, 32);
  // Track which trigger opened the modal so focus returns there on close.
  var lastTrigger = triggers[0];

  var DISCOVERY_ENDPOINT = 'https://api.callmeie.ie/api/discovery';

  var STEPS = [
    {
      key: 'business',
      prompt: '<strong>What\'s your business?</strong>',
      options: [
        { value: 'dental', label: 'Dental' },
        { value: 'motor-factors', label: 'Motor factors' },
        { value: 'plumber', label: 'Plumber' },
        { value: 'electrician', label: 'Electrician' },
        { value: 'mechanic', label: 'Mechanic' },
        { value: 'restaurant', label: 'Restaurant' },
        { value: 'cafe', label: 'Cafe' },
        { value: 'salon', label: 'Salon' },
        { value: 'solicitor', label: 'Solicitor' },
        { value: 'other', label: 'Other' }
      ],
      allowOther: true
    },
    {
      key: 'pain',
      prompt: '<strong>Biggest unfinished labour each week?</strong>',
      options: [
        { value: 'missed-calls', label: 'Missed calls' },
        { value: 'invoice-review', label: 'Invoice review' },
        { value: 'outdated-website', label: 'Outdated website' },
        { value: 'lead-capture', label: 'Lead capture' },
        { value: 'other', label: 'Something else' }
      ],
      allowOther: true
    },
    {
      key: 'team_size',
      prompt: '<strong>Team size?</strong>',
      options: [
        { value: 'solo', label: 'Just me' },
        { value: '2-5', label: '2 – 5' },
        { value: '6-15', label: '6 – 15' },
        { value: '16-50', label: '16 – 50' }
      ]
    },
    {
      key: 'urgency',
      prompt: '<strong>Urgency?</strong>',
      options: [
        { value: 'this-month', label: 'This month' },
        { value: 'next-quarter', label: 'Next quarter' },
        { value: 'exploring', label: 'Just exploring' }
      ]
    }
  ];

  var state = {
    stepIndex: -1, // -1 = intro screen, 0..3 = questions, 4 = result
    answers: {},
    submitting: false
  };

  function openShell() {
    state.stepIndex = -1;
    state.answers = {};
    state.submitting = false;
    shell.hidden = false;
    document.body.style.overflow = 'hidden';
    renderIntro();
    setTimeout(function () { (closeBtn || shell).focus(); }, 30);
  }

  function closeShell() {
    shell.hidden = true;
    document.body.style.overflow = '';
    try { lastTrigger.focus(); } catch (_) { /* noop */ }
  }

  function escClose(e) { if (e.key === 'Escape' && !shell.hidden) closeShell(); }

  triggers.forEach(function (t) {
    t.addEventListener('click', function () {
      lastTrigger = t;
      openShell();
    });
  });
  closeBtn.addEventListener('click', closeShell);
  shell.addEventListener('click', function (e) { if (e.target === shell) closeShell(); });
  document.addEventListener('keydown', escClose);

  function setProgress(text) { progress.textContent = text; }

  function renderIntro() {
    setProgress('Intro');
    body.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'cmt-chat-prompt';
    p.innerHTML = 'I match Irish SMBs to the right CallMeIE product — receptionist, document ops, or AI-first website. <strong>4 quick questions, ~30 seconds.</strong>';
    var note = document.createElement('p');
    note.className = 'cmt-chat-prompt';
    note.style.fontSize = '13px';
    note.style.color = 'var(--cmt-muted, #6b665d)';
    note.textContent = 'I\'m an AI quiz. Adam (founder) reviews every booking before he contacts you.';

    var actions = document.createElement('div');
    actions.className = 'cmt-chat-skip-row';
    var start = document.createElement('button');
    start.type = 'button';
    start.className = 'cmt-chat-btn cmt-chat-btn-primary';
    start.textContent = 'Start →';
    start.addEventListener('click', function () { state.stepIndex = 0; renderStep(); });
    var direct = document.createElement('a');
    direct.href = 'mailto:hello@callmeie.ie?subject=Talk%20to%20CallMeIE';
    direct.className = 'cmt-chat-btn cmt-chat-btn-ghost';
    direct.textContent = 'Email Adam directly →';

    actions.appendChild(start);
    actions.appendChild(direct);

    body.appendChild(p);
    body.appendChild(note);
    body.appendChild(actions);
  }

  function renderStep() {
    var step = STEPS[state.stepIndex];
    setProgress((state.stepIndex + 1) + ' / ' + STEPS.length);
    body.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'cmt-chat-prompt';
    p.innerHTML = step.prompt;
    body.appendChild(p);

    var chips = document.createElement('div');
    chips.className = 'cmt-chat-chips';
    var current = state.answers[step.key];
    step.options.forEach(function (opt) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cmt-chat-chip';
      btn.textContent = opt.label;
      btn.setAttribute('aria-pressed', current === opt.value ? 'true' : 'false');
      btn.addEventListener('click', function () { selectChip(step, opt.value); });
      chips.appendChild(btn);
    });
    body.appendChild(chips);

    // Build the Next/Submit button up-front so the "Other" input handler
    // below can close over `next` and live-update its disabled state on
    // every keystroke. (Earlier version built the input first then the
    // button — so typing into the Other field updated state but never
    // re-evaluated the button. Adam caught this on /docs/ 2026-05-09:
    // pick Other → type → Next stayed grayed out.)
    var next = document.createElement('button');
    next.type = 'button';
    next.className = 'cmt-chat-btn cmt-chat-btn-primary';
    // After P2-7 the contact step (renderContactStep) sits between the
    // last chip step and submit, so even the final chip page is
    // logically "Next →" — the "See my fit" button lives in the
    // contact step.
    next.textContent = 'Next →';
    next.addEventListener('click', advance);

    function syncNext() {
      var v = state.answers[step.key];
      // Disabled when: no answer at all, OR Other is selected but the
      // free-text field is still empty (state === 'other:' literal).
      next.disabled = !v || v === 'other:';
      next.style.opacity = next.disabled ? '0.55' : '1';
    }

    // Custom-text fallback for "Other"
    if (step.allowOther && current && current.indexOf('other:') === 0) {
      var inputWrap = document.createElement('div');
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'cmt-chat-input';
      input.placeholder = 'Tell me in a few words…';
      input.maxLength = 120;
      input.value = current.slice('other:'.length);
      input.addEventListener('input', function () {
        state.answers[step.key] = 'other:' + input.value.trim();
        syncNext();
      });
      // Pressing Enter in the Other input advances when valid (no need to
      // reach for the mouse).
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !next.disabled) {
          e.preventDefault();
          advance();
        }
      });
      inputWrap.appendChild(input);
      body.appendChild(inputWrap);
    }

    var nav = document.createElement('div');
    nav.className = 'cmt-chat-skip-row';
    if (state.stepIndex > 0) {
      var back = document.createElement('button');
      back.type = 'button';
      back.className = 'cmt-chat-btn cmt-chat-btn-ghost';
      back.textContent = '← Back';
      back.addEventListener('click', function () { state.stepIndex -= 1; renderStep(); });
      nav.appendChild(back);
    }
    var spacer = document.createElement('span');
    spacer.style.flex = '1';
    nav.appendChild(spacer);
    syncNext();
    nav.appendChild(next);
    body.appendChild(nav);

    // If the Other input is on screen, focus it so the visitor can type
    // immediately without an extra click.
    var openInput = body.querySelector('.cmt-chat-input');
    if (openInput) {
      try { openInput.focus(); } catch (_) { /* noop */ }
    }
  }

  function selectChip(step, value) {
    if (value === 'other' && step.allowOther) {
      state.answers[step.key] = 'other:';
    } else {
      state.answers[step.key] = value;
    }
    renderStep();
  }

  function advance() {
    if (state.stepIndex < STEPS.length - 1) {
      state.stepIndex += 1;
      renderStep();
    } else if (!state.askedContact) {
      // P2-7 — after the 4 chip questions, ask one optional contact
      // step before firing the submit. Visitor can skip with the
      // ghost button. If they skip, the server-side handoff result
      // text will steer them to the visible mailto button instead of
      // promising "Adam will email you" (which can't be delivered
      // when no email was given).
      state.askedContact = true;
      renderContactStep();
    } else {
      submit();
    }
  }

  function renderContactStep() {
    setProgress('Almost done');
    body.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'cmt-chat-prompt';
    p.innerHTML = '<strong>How can Adam reach you?</strong> Optional — if you\'d rather email us first, skip this and we\'ll show the address.';
    body.appendChild(p);

    var emailInput = document.createElement('input');
    emailInput.type = 'email';
    emailInput.className = 'cmt-chat-input';
    emailInput.placeholder = 'Email (optional)';
    emailInput.maxLength = 160;
    emailInput.value = state.answers.contact_email || '';
    emailInput.addEventListener('input', function () {
      state.answers.contact_email = emailInput.value.trim();
    });
    body.appendChild(emailInput);

    var nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.className = 'cmt-chat-input';
    nameInput.placeholder = 'Your name (optional)';
    nameInput.maxLength = 80;
    nameInput.value = state.answers.contact_name || '';
    nameInput.addEventListener('input', function () {
      state.answers.contact_name = nameInput.value.trim();
    });
    body.appendChild(nameInput);

    var nav = document.createElement('div');
    nav.className = 'cmt-chat-skip-row';

    var back = document.createElement('button');
    back.type = 'button';
    back.className = 'cmt-chat-btn cmt-chat-btn-ghost';
    back.textContent = '← Back';
    back.addEventListener('click', function () {
      state.askedContact = false;
      renderStep();
    });
    nav.appendChild(back);

    var spacer = document.createElement('span');
    spacer.style.flex = '1';
    nav.appendChild(spacer);

    var skip = document.createElement('button');
    skip.type = 'button';
    skip.className = 'cmt-chat-btn cmt-chat-btn-ghost';
    skip.textContent = 'Skip · I\'ll email';
    skip.addEventListener('click', function () {
      state.answers.contact_email = '';
      state.answers.contact_name = '';
      submit();
    });
    nav.appendChild(skip);

    var done = document.createElement('button');
    done.type = 'button';
    done.className = 'cmt-chat-btn cmt-chat-btn-primary';
    done.textContent = 'See my fit →';
    done.addEventListener('click', submit);
    nav.appendChild(done);

    body.appendChild(nav);
    try { emailInput.focus(); } catch (_) { /* noop */ }
  }

  function submit() {
    if (state.submitting) return;
    state.submitting = true;
    setProgress('Matching…');
    body.innerHTML = '';
    var loader = document.createElement('div');
    loader.className = 'cmt-chat-loading';
    loader.textContent = 'Matching you to the closest CallMeIE product…';
    body.appendChild(loader);

    var payload = {
      page_context: pageContext,
      business: state.answers.business || '',
      pain: state.answers.pain || '',
      team_size: state.answers.team_size || '',
      urgency: state.answers.urgency || '',
      contact_email: state.answers.contact_email || '',
      contact_name: state.answers.contact_name || ''
    };

    fetch(DISCOVERY_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) {
        if (!r.ok) {
          // Carry the status + parsed body up so renderError can branch
          // on 400 (invalid input) vs 429 (rate-limit, has Retry-After)
          // vs 5xx (real server error). Without this every non-2xx
          // showed the same "couldn't reach backend" message — see P0-8.
          return r.json().catch(function () { return {}; }).then(function (errBody) {
            var e = new Error('http_' + r.status);
            e.status = r.status;
            e.errBody = errBody || {};
            throw e;
          });
        }
        return r.json();
      })
      .then(renderResult)
      .catch(renderError);
  }

  function renderResult(data) {
    setProgress('Done');
    body.innerHTML = '';

    var card = document.createElement('div');
    card.className = 'cmt-chat-result';
    var tag = document.createElement('span');
    tag.className = 'cmt-chat-result-tag';
    tag.textContent = labelForProduct(data.recommended_product);
    card.appendChild(tag);

    if (data.tier_anchor) {
      var anchor = document.createElement('span');
      anchor.className = 'cmt-chat-result-anchor';
      anchor.textContent = data.tier_anchor;
      card.appendChild(anchor);
    }

    var text = document.createElement('p');
    text.className = 'cmt-chat-result-text';
    text.textContent = data.result_text || 'I\'m flagging this one for Adam — he\'ll email you in the next day or two.';
    card.appendChild(text);
    body.appendChild(card);

    var ctas = document.createElement('div');
    ctas.className = 'cmt-chat-cta-list';
    (data.ctas || []).forEach(function (c) {
      var a = document.createElement('a');
      a.className = 'cmt-chat-cta';
      a.href = c.href;
      a.textContent = c.label;
      a.setAttribute('data-kind', c.kind || 'secondary');
      if (c.href.indexOf('http') === 0) {
        a.target = '_blank';
        a.rel = 'noopener';
      }
      ctas.appendChild(a);
    });
    body.appendChild(ctas);

    state.submitting = false;
  }

  function renderError(err) {
    setProgress('Error');
    body.innerHTML = '';

    // Branch the message on what actually failed so the visitor doesn't
    // see "couldn't reach backend" when they were actually rate-limited
    // or sent malformed input. (P0-8 — paired with server.py setting
    // Retry-After + RateLimit-* headers on 429 + the JSON envelope on
    // every other status.)
    var status = err && err.status ? err.status : 0;
    var errBody = (err && err.errBody) || {};
    var msg, showRetry = true;

    if (status === 429) {
      var retryAfter = parseInt(errBody.retry_after || '0', 10);
      var minutes = retryAfter > 0 ? Math.max(1, Math.ceil(retryAfter / 60)) : 0;
      if (errBody.error === 'daily_cap_reached') {
        msg = 'Today\'s quiz quota is fully booked. ' +
              'Easiest path: email hello@callmeie.ie or message us on WhatsApp (the green button) — Adam reads both same-day.';
        showRetry = false;
      } else if (minutes > 0) {
        msg = 'You\'ve already submitted a few quizzes from this address. ' +
              'Try again in about ' + minutes + ' min — or skip the wait and email hello@callmeie.ie / WhatsApp the green button.';
        showRetry = false;
      } else {
        msg = 'You\'ve already submitted a few quizzes from this address. ' +
              'Try again in a few minutes — or skip the wait and email hello@callmeie.ie / WhatsApp the green button.';
        showRetry = false;
      }
    } else if (status === 400) {
      msg = 'The form sent something I couldn\'t read. Refresh the page and try the quiz again — if it keeps happening, email hello@callmeie.ie and Adam will sort it.';
    } else if (status >= 500) {
      msg = 'Our matcher hit an error on our side. Fastest path: email hello@callmeie.ie or message us on WhatsApp (the green button) — Adam reads both same-day.';
    } else {
      // Status 0 = network failure, fetch rejection, CORS, offline.
      msg = 'Couldn\'t reach our matcher — looks like a network hiccup. Try again, or email hello@callmeie.ie / WhatsApp the green button.';
    }

    var p = document.createElement('div');
    p.className = 'cmt-chat-error';
    p.textContent = msg;
    body.appendChild(p);

    var nav = document.createElement('div');
    nav.className = 'cmt-chat-skip-row';
    if (showRetry) {
      var retry = document.createElement('button');
      retry.type = 'button';
      retry.className = 'cmt-chat-btn cmt-chat-btn-primary';
      retry.textContent = 'Try again';
      retry.addEventListener('click', function () { state.submitting = false; submit(); });
      nav.appendChild(retry);
    }
    var mail = document.createElement('a');
    mail.href = 'mailto:hello@callmeie.ie?subject=Talk%20to%20CallMeIE%20%E2%80%94%20discovery%20widget%20error';
    mail.className = 'cmt-chat-btn cmt-chat-btn-ghost';
    mail.textContent = 'Email Adam';
    nav.appendChild(mail);
    body.appendChild(nav);

    state.submitting = false;
    if (window.console) console.warn('[cmt-chat] discovery submit failed:', err);
  }

  function labelForProduct(rec) {
    switch (rec) {
      case 'receptionist': return 'AI Receptionist';
      case 'docs':         return 'Document Ops';
      case 'websites':     return 'AI-First Websites';
      case 'founder-handoff': return 'Adam will follow up';
      default:             return 'Match';
    }
  }
  }
})();
</script>
