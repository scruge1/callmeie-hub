name: cohesion drift check
on:
  pull_request:
    paths:
      - '_partials/**'
      - 'scripts/inject-cohesion.py'
      - '**/*.html'
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify cohesion-layer drift
        run: python scripts/inject-cohesion.py --check
